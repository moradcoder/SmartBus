<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="tramGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Corps du tram -->
  <rect x="4" y="20" width="56" height="22" rx="6" ry="6" fill="url(#tramGrad)" stroke="#065f46" stroke-width="1.5"/>
  
  <!-- Toit arrondi -->
  <path d="M 10 20 Q 32 10 54 20" fill="#059669" stroke="#065f46" stroke-width="1.5"/>
  
  <!-- Fenêtre avant -->
  <path d="M 4 24 L 12 24 L 12 36 L 4 36 Z" rx="2" ry="2" fill="#93c5fd" stroke="#065f46" stroke-width="1" opacity="0.8"/>
  
  <!-- Fenêtres -->
  <rect x="16" y="22" width="8" height="12" rx="2" ry="2" fill="#93c5fd" stroke="#065f46" stroke-width="1" opacity="0.8"/>
  <rect x="28" y="22" width="8" height="12" rx="2" ry="2" fill="#93c5fd" stroke="#065f46" stroke-width="1" opacity="0.8"/>
  <rect x="40" y="22" width="8" height="12" rx="2" ry="2" fill="#93c5fd" stroke="#065f46" stroke-width="1" opacity="0.8"/>
  
  <!-- Fenêtre arrière -->
  <path d="M 52 24 L 60 24 L 60 36 L 52 36 Z" rx="2" ry="2" fill="#93c5fd" stroke="#065f46" stroke-width="1" opacity="0.8"/>
  
  <!-- Portes -->
  <rect x="14" y="30" width="6" height="10" rx="1" fill="#a7f3d0" stroke="#065f46" stroke-width="0.8"/>
  <rect x="26" y="30" width="6" height="10" rx="1" fill="#a7f3d0" stroke="#065f46" stroke-width="0.8"/>
  <rect x="38" y="30" width="6" height="10" rx="1" fill="#a7f3d0" stroke="#065f46" stroke-width="0.8"/>
  <rect x="50" y="30" width="6" height="10" rx="1" fill="#a7f3d0" stroke="#065f46" stroke-width="0.8"/>
  
  <!-- Ligne de séparation -->
  <line x1="4" y1="32" x2="60" y2="32" stroke="#065f46" stroke-width="0.8" stroke-dasharray="3,3"/>
  
  <!-- Pantographe -->
  <rect x="30" y="8" width="4" height="4" fill="#1f2937"/>
  <line x1="28" y1="8" x2="36" y2="8" stroke="#1f2937" stroke-width="2"/>
  <line x1="32" y1="10" x2="32" y2="18" stroke="#1f2937" stroke-width="1.5"/>
  
  <!-- Caténaire -->
  <line x1="0" y1="8" x2="64" y2="8" stroke="#374151" stroke-width="1.5" stroke-dasharray="4,4"/>
  
  <!-- Roues -->
  <ellipse cx="14" cy="44" rx="5" ry="3" fill="#1f2937" stroke="#111827" stroke-width="1.5"/>
  <ellipse cx="14" cy="44" rx="2.5" ry="1.5" fill="#4b5563"/>
  
  <ellipse cx="28" cy="44" rx="5" ry="3" fill="#1f2937" stroke="#111827" stroke-width="1.5"/>
  <ellipse cx="28" cy="44" rx="2.5" ry="1.5" fill="#4b5563"/>
  
  <ellipse cx="42" cy="44" rx="5" ry="3" fill="#1f2937" stroke="#111827" stroke-width="1.5"/>
  <ellipse cx="42" cy="44" rx="2.5" ry="1.5" fill="#4b5563"/>
  
  <ellipse cx="54" cy="44" rx="5" ry="3" fill="#1f2937" stroke="#111827" stroke-width="1.5"/>
  <ellipse cx="54" cy="44" rx="2.5" ry="1.5" fill="#4b5563"/>
  
  <!-- Rails -->
