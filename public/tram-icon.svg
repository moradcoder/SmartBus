  <line x1="0" y1="52" x2="64" y2="52" stroke="#4b5563" stroke-width="1.5" opacity="0.5"/>
  
  <!-- Phares -->
  <circle cx="2" cy="34" r="2.5" fill="#fef08a" stroke="#eab308" stroke-width="0.8"/>
  <circle cx="62" cy="34" r="2" fill="#ef4444" stroke="#dc2626" stroke-width="0.8"/>
  
  <!-- Rétroviseurs -->
  <rect x="4" y="22" width="3" height="2" rx="0.5" fill="#065f46"/>
  <rect x="57" y="22" width="3" height="2" rx="0.5" fill="#065f46"/>
