<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="trainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6d28d9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Corps du train -->
  <rect x="4" y="20" width="56" height="24" rx="4" ry="4" fill="url(#trainGrad)" stroke="#4c1d95" stroke-width="1.5"/>
  
  <!-- Toit arrondi -->
  <path d="M 8 20 Q 32 8 56 20" fill="#7c3aed" stroke="#4c1d95" stroke-width="1.5"/>
  
  <!-- Cabine conducteur -->
  <rect x="4" y="20" width="8" height="24" rx="2" ry="2" fill="#5b21b6" stroke="#4c1d95" stroke-width="1"/>
  
  <!-- Fenêtre cabine -->
  <rect x="6" y="24" width="4" height="6" rx="1" fill="#93c5fd" stroke="#4c1d95" stroke-width="0.8"/>
  
  <!-- Fenêtres -->
  <rect x="16" y="22" width="8" height="10" rx="2" ry="2" fill="#93c5fd" stroke="#4c1d95" stroke-width="1" opacity="0.8"/>
  <rect x="28" y="22" width="8" height="10" rx="2" ry="2" fill="#93c5fd" stroke="#4c1d95" stroke-width="1" opacity="0.8"/>
  <rect x="40" y="22" width="8" height="10" rx="2" ry="2" fill="#93c5fd" stroke="#4c1d95" stroke-width="1" opacity="0.8"/>
  
  <!-- Fenêtre arrière -->
  <rect x="54" y="24" width="4" height="6" rx="1" fill="#93c5fd" stroke="#4c1d95" stroke-width="0.8" opacity="0.6"/>
  
  <!-- Portes -->
  <rect x="12" y="30" width="4" height="12" rx="1" fill="#c4b5fd" stroke="#4c1d95" stroke-width="0.8"/>
  <rect x="24" y="30" width="4" height="12" rx="1" fill="#c4b5fd" stroke="#4c1d95" stroke-width="0.8"/>
  <rect x="36" y="30" width="4" height="12" rx="1" fill="#c4b5fd" stroke="#4c1d95" stroke-width="0.8"/>
  <rect x="48" y="30" width="4" height="12" rx="1" fill="#c4b5fd" stroke="#4c1d95" stroke-width="0.8"/>
  
  <!-- Ligne de séparation -->
  <line x1="4" y1="32" x2="60" y2="32" stroke="#4c1d95" stroke-width="0.8" stroke-dasharray="2,2"/>
  
  <!-- Roues -->
  <circle cx="14" cy="46" r="6" fill="#1f2937" stroke="#111827" stroke-width="1.5"/>
  <circle cx="14" cy="46" r="3" fill="#4b5563"/>
  
  <circle cx="28" cy="46" r="6" fill="#1f2937" stroke="#111827" stroke-width="1.5"/>
  <circle cx="28" cy="46" r="3" fill="#4b5563"/>
  
  <circle cx="42" cy="46" r="6" fill="#1f2937" stroke="#111827" stroke-width="1.5"/>
  <circle cx="42" cy="46" r="3" fill="#4b5563"/>
  
  <circle cx="54" cy="46" r="6" fill="#1f2937" stroke="#111827" stroke-width="1.5"/>
  <circle cx="54" cy="46" r="3" fill="#4b5563"/>
  
  <!-- Rails -->
  <line x1="0" y1="50" x2="64" y2="50" stroke="#4b5563" stroke-width="2"/>
  <line x1="0" y1="54" x2="64" y2="54" stroke="#4b5563" stroke-width="2"/>
  
  <!-- Caténaire -->
  <line x1="0" y1="12" x2="64" y2="12" stroke="#374151" stroke-width="1.5"/>
  <line x1="16" y1="12" x2="16" y2="20" stroke="#374151" stroke-width="1"/>
  <line x1="32" y1="12" x2="32" y2="20" stroke="#374151" stroke-width="1"/>
  <line x1="48" y1="12" x2="48" y2="20" stroke="#374151" stroke-width="1"/>
  
  <!-- Phares -->
  <circle cx="2" cy="36" r="2" fill="#fef08a" stroke="#eab308" stroke-width="0.8"/>
  <circle cx="62" cy="36" r="2" fill="#ef4444" stroke="#dc2626" stroke-width="0.8"/>
</svg>