<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="busGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Corps du bus -->
  <rect x="8" y="20" width="48" height="28" rx="4" ry="4" fill="url(#busGrad)" stroke="#1e3a8a" stroke-width="1.5"/>
  
  <!-- Toit -->
  <rect x="14" y="16" width="36" height="6" rx="2" ry="2" fill="#2563eb" stroke="#1e3a8a" stroke-width="1"/>
  
  <!-- Fenêtre avant -->
  <rect x="12" y="22" width="10" height="10" rx="2" ry="2" fill="#93c5fd" stroke="#1e3a8a" stroke-width="1" opacity="0.8"/>
  
  <!-- Fenêtres latérales -->
  <rect x="26" y="22" width="8" height="10" rx="1" ry="1" fill="#93c5fd" stroke="#1e3a8a" stroke-width="1" opacity="0.8"/>
  <rect x="37" y="22" width="8" height="10" rx="1" ry="1" fill="#93c5fd" stroke="#1e3a8a" stroke-width="1" opacity="0.8"/>
  
  <!-- Fenêtre arrière -->
  <rect x="49" y="22" width="6" height="10" rx="1" ry="1" fill="#93c5fd" stroke="#1e3a8a" stroke-width="1" opacity="0.8"/>
  
  <!-- Phares avant -->
  <circle cx="56" cy="35" r="3" fill="#fef08a" stroke="#eab308" stroke-width="1"/>
  <circle cx="56" cy="40" r="2.5" fill="#fef08a" stroke="#eab308" stroke-width="1"/>
  
  <!-- Feux arrière -->
  <circle cx="8" cy="35" r="2.5" fill="#ef4444" stroke="#dc2626" stroke-width="1"/>
  <circle cx="8" cy="40" r="2" fill="#ef4444" stroke="#dc2626" stroke-width="1"/>
  
  <!-- Roue avant -->
  <circle cx="18" cy="48" r="6" fill="#1f2937" stroke="#111827" stroke-width="1.5"/>
  <circle cx="18" cy="48" r="3" fill="#4b5563" stroke="#374151" stroke-width="1"/>
  
  <!-- Roue arrière -->
  <circle cx="46" cy="48" r="6" fill="#1f2937" stroke="#111827" stroke-width="1.5"/>
  <circle cx="46" cy="48" r="3" fill="#4b5563" stroke="#374151" stroke-width="1"/>
  
  <!-- Ligne de séparation -->
  <line x1="8" y1="32" x2="56" y2="32" stroke="#1e3a8a" stroke-width="1" stroke-dasharray="2,2"/>
  
  <!-- Rétroviseur -->
  <rect x="52" y="20" width="4" height="3" rx="1" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="0.5"/>
</svg>