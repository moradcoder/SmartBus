<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="metroGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b91c1c;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Corps du métro -->
  <rect x="6" y="18" width="52" height="26" rx="6" ry="6" fill="url(#metroGrad)" stroke="#7f1d1d" stroke-width="1.5"/>
  
  <!-- Toit arrondi -->
  <path d="M 14 18 Q 32 8 50 18" fill="#dc2626" stroke="#7f1d1d" stroke-width="1.5"/>
  
  <!-- Fenêtres -->
  <rect x="14" y="22" width="8" height="10" rx="2" ry="2" fill="#bae6fd" stroke="#7f1d1d" stroke-width="1" opacity="0.8"/>
  <rect x="26" y="22" width="8" height="10" rx="2" ry="2" fill="#bae6fd" stroke="#7f1d1d" stroke-width="1" opacity="0.8"/>
  <rect x="38" y="22" width="8" height="10" rx="2" ry="2" fill="#bae6fd" stroke="#7f1d1d" stroke-width="1" opacity="0.8"/>
  
  <!-- Fenêtre avant -->
  <rect x="6" y="22" width="6" height="10" rx="2" ry="2" fill="#bae6fd" stroke="#7f1d1d" stroke-width="1" opacity="0.8"/>
  
  <!-- Portes -->
  <rect x="18" y="32" width="4" height="10" rx="1" fill="#fca5a5" stroke="#7f1d1d" stroke-width="0.8"/>
  <rect x="42" y="32" width="4" height="10" rx="1" fill="#fca5a5" stroke="#7f1d1d" stroke-width="0.8"/>
  
  <!-- Ligne de toit -->
  <line x1="10" y1="18" x2="54" y2="18" stroke="#7f1d1d" stroke-width="1.5"/>
  
  <!-- Roues -->
  <ellipse cx="20" cy="46" rx="6" ry="4" fill="#1f2937" stroke="#111827" stroke-width="1.5"/>
  <ellipse cx="20" cy="46" rx="3" ry="2" fill="#4b5563"/>
  
  <ellipse cx="44" cy="46" rx="6" ry="4" fill="#1f2937" stroke="#111827" stroke-width="1.5"/>
  <ellipse cx="44" cy="46" rx="3" ry="2" fill="#4b5563"/>
  
  <!-- Rails -->
  <rect x="4" y="48" width="56" height="2" rx="1" fill="#4b5563" opacity="0.5"/>
  <rect x="4" y="52" width="56" height="2" rx="1" fill="#4b5563" opacity="0.3"/>
  
  <!-- Caténaire -->
  <line x1="4" y1="12" x2="60" y2="12" stroke="#374151" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="32" y1="12" x2="32" y2="18" stroke="#374151" stroke-width="1.5"/>
  
  <!-- Phares -->
  <circle cx="58" cy="30" r="2.5" fill="#fef08a" stroke="#eab308" stroke-width="0.8"/>
</svg>